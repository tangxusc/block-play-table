services:
  manager:
    build:
      context: .
      dockerfile: Dockerfile.manager
    environment:
      MANAGER_HTTP_ADDR: ":8080"
      DB_DRIVER: "postgres"
      DB_DSN: "postgres://manager:${POSTGRES_PASSWORD:-password}@postgres:5432/block_play_table?sslmode=disable"
      WORKER_TOKEN: "${WORKER_TOKEN:?set WORKER_TOKEN in .env}"
      WORKER_HEARTBEAT_TIMEOUT: "${WORKER_HEARTBEAT_TIMEOUT:-90s}"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      MANAGER_WS_URL: "ws://manager:8080/worker/ws"
      WORKER_ID: "${WORKER_ID:-worker-001}"
      WORKER_NAME: "${WORKER_NAME:-team-worker}"
      WORKER_WORK_DIR: "/worker-data"
      WORKER_SUPPORTED_AGENTS: "${WORKER_SUPPORTED_AGENTS:-codex,claude}"
      WORKER_TOKEN: "${WORKER_TOKEN:?set WORKER_TOKEN in .env}"
    volumes:
      - worker_data:/worker-data
    depends_on:
      - manager

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
      args:
        MANAGER_GRAPHQL_URL: "${MANAGER_GRAPHQL_URL:-http://localhost:8080/graphql}"
    ports:
      - "3000:80"
    depends_on:
      - manager

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "manager"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-password}"
      POSTGRES_DB: "block_play_table"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manager -d block_play_table"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  worker_data:
