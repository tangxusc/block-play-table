name: Real Agent Release Gate

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: real-agent-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  real-agent-e2e:
    name: Real Agent e2e
    runs-on:
      - self-hosted
      - linux
      - real-agent
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify runner tools
        shell: bash
        run: |
          for tool in go node npm bash curl python3 codex claude; do
            command -v "$tool"
          done
          go version
          node --version
          npm --version
          codex --version
          claude --version

      - name: Install Node dependencies
        run: npm ci

      - name: Run real Agent e2e
        shell: bash
        env:
          GO_BIN: go
          GOTOOLCHAIN: local
          WORKER_DIR: ${{ github.workspace }}/worker-data-real-e2e
          REAL_AGENT_CODEX_MODEL: ${{ vars.REAL_AGENT_CODEX_MODEL }}
          REAL_AGENT_CLAUDE_MODEL: ${{ vars.REAL_AGENT_CLAUDE_MODEL }}
        run: |
          mkdir -p artifacts/logs
          rm -rf "$WORKER_DIR"
          set -o pipefail
          npm run e2e:real-agents 2>&1 | tee artifacts/logs/real-agent-e2e.log

      - name: Upload real Agent artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: real-agent-e2e-artifacts
          if-no-files-found: ignore
          path: artifacts/logs/

  publish-version-images:
    name: Publish version images
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: real-agent-e2e
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - component: manager
            dockerfile: Dockerfile.manager
            build-args: ""
          - component: worker
            dockerfile: Dockerfile.worker
            build-args: ""
          - component: ui
            dockerfile: ui/Dockerfile
            build-args: |
              VITE_MANAGER_GRAPHQL_URL=http://localhost:8080/graphql
              VITE_MANAGER_GRAPHQL_WS_URL=ws://localhost:8080/subscriptions

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image name
        id: image
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "name=${REGISTRY}/${repository}-${{ matrix.component }}" >> "$GITHUB_OUTPUT"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build-args }}
