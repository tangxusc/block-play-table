name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  go-checks:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run Go tests
        shell: bash
        run: |
          mkdir -p artifacts/logs
          set -o pipefail
          make test 2>&1 | tee artifacts/logs/make-test.log

      - name: Run coverage gate
        shell: bash
        run: |
          mkdir -p artifacts/logs
          set -o pipefail
          make coverage 2>&1 | tee artifacts/logs/make-coverage.log

      - name: Build Go binaries
        shell: bash
        run: |
          mkdir -p artifacts/logs
          set -o pipefail
          make build 2>&1 | tee artifacts/logs/make-build.log

      - name: Upload Go check artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: go-check-artifacts
          if-no-files-found: ignore
          path: |
            artifacts/logs/
            coverage*.out
            coverage*.txt

  docker-checks:
    name: Docker and Flutter checks
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run Flutter tests in Docker
        shell: bash
        run: |
          mkdir -p artifacts/logs
          set -o pipefail
          make flutter-test 2>&1 | tee artifacts/logs/make-flutter-test.log

      - name: Build Docker images
        shell: bash
        run: |
          mkdir -p artifacts/logs
          set -o pipefail
          make docker-build 2>&1 | tee artifacts/logs/make-docker-build.log

      - name: Upload Docker check artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docker-check-artifacts
          if-no-files-found: ignore
          path: artifacts/logs/

  publish-main-images:
    name: Publish main images
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs:
      - go-checks
      - docker-checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - component: manager
            dockerfile: Dockerfile.manager
            build-args: ""
          - component: worker
            dockerfile: Dockerfile.worker
            build-args: ""
          - component: ui
            dockerfile: ui/Dockerfile
            build-args: |
              MANAGER_GRAPHQL_URL=http://localhost:8080/graphql

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image name
        id: image
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "name=${REGISTRY}/${repository}-${{ matrix.component }}" >> "$GITHUB_OUTPUT"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=raw,value=main
            type=sha,prefix=sha-,format=short

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build-args }}
