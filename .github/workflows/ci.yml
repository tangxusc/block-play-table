name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  go-checks:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Run Go tests
        shell: bash
        run: |
          mkdir -p artifacts/logs
          set -o pipefail
          make test 2>&1 | tee artifacts/logs/make-test.log

      - name: Run coverage gate
        shell: bash
        run: |
          mkdir -p artifacts/logs
          set -o pipefail
          make coverage 2>&1 | tee artifacts/logs/make-coverage.log

      - name: Run fuzz gate
        shell: bash
        env:
          FUZZ_TIME: 10s
        run: |
          mkdir -p artifacts/logs
          set -o pipefail
          make fuzz 2>&1 | tee artifacts/logs/make-fuzz.log

      - name: Validate A2A extension assets
        run: npm run validate:a2a

      - name: Run Go end-to-end tests
        shell: bash
        run: |
          mkdir -p artifacts/logs
          set -o pipefail
          make e2e 2>&1 | tee artifacts/logs/make-e2e.log

      - name: Build Go binaries
        shell: bash
        run: |
          mkdir -p artifacts/logs
          set -o pipefail
          make build 2>&1 | tee artifacts/logs/make-build.log

      - name: Upload Go check artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: go-check-artifacts
          if-no-files-found: ignore
          path: |
            artifacts/logs/
            coverage*.out
            coverage*.txt
            .coverage/go-statement/
            .coverage/go-branch/
            .coverage/fuzz-cases.txt
            ui/coverage/

  ui-and-docker-checks:
    name: UI and Docker checks
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Typecheck Vue UI
        shell: bash
        run: |
          mkdir -p artifacts/logs
          set -o pipefail
          make ui-typecheck 2>&1 | tee artifacts/logs/make-ui-typecheck.log

      - name: Run Vue UI tests
        shell: bash
        run: |
          mkdir -p artifacts/logs
          set -o pipefail
          npm test 2>&1 | tee artifacts/logs/npm-test.log

      - name: Build Vue UI
        shell: bash
        run: |
          mkdir -p artifacts/logs
          set -o pipefail
          make ui-build 2>&1 | tee artifacts/logs/make-ui-build.log

      - name: Build Docker images
        shell: bash
        run: |
          mkdir -p artifacts/logs
          set -o pipefail
          make docker-build 2>&1 | tee artifacts/logs/make-docker-build.log

      - name: Upload Docker check artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-docker-check-artifacts
          if-no-files-found: ignore
          path: artifacts/logs/

  browser-e2e:
    name: Browser end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local stack
        shell: bash
        run: |
          mkdir -p artifacts/logs
          set -o pipefail
          make run-local 2>&1 | tee artifacts/logs/make-run-local.log

      - name: Run Playwright end-to-end tests
        shell: bash
        run: |
          set -o pipefail
          npm run e2e 2>&1 | tee artifacts/logs/npm-e2e.log

      - name: Stop local stack
        if: always()
        shell: bash
        run: |
          set -o pipefail
          make stop-local 2>&1 | tee artifacts/logs/make-stop-local.log

      - name: Upload browser end-to-end artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-e2e-artifacts
          if-no-files-found: ignore
          path: |
            artifacts/logs/
            .local-run/*.log
            test-results/
            playwright-report/

  publish-main-images:
    name: Publish main images
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs:
      - go-checks
      - ui-and-docker-checks
      - browser-e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - component: manager
            dockerfile: Dockerfile.manager
            build-args: ""
          - component: worker
            dockerfile: Dockerfile.worker
            build-args: ""
          - component: ui
            dockerfile: ui/Dockerfile
            build-args: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image name
        id: image
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "name=${REGISTRY}/${repository}-${{ matrix.component }}" >> "$GITHUB_OUTPUT"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=raw,value=main
            type=sha,prefix=sha-,format=short

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build-args }}
