name: Deploy UI to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "ui/**"
      - "docs/a2a/extensions/**"
      - "scripts/validate-a2a-extension.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build UI
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Typecheck UI
        run: npm run typecheck

      - name: Validate A2A extension assets
        run: npm run validate:a2a

      - name: Build UI for Pages
        env:
          GITHUB_PAGES: "true"
        run: |
          npm run build
          mkdir -p ui/dist/a2a/extensions
          cp -R docs/a2a/extensions/. ui/dist/a2a/extensions/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ui/dist

  deploy:
    name: Deploy UI
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
