<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Board Project Filter Preview</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f8fa;
        color: #1d2329;
      }

      body {
        margin: 0;
        padding: 32px;
      }

      .surface {
        max-width: 1100px;
        min-height: 620px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        border: 1px solid #d9dee5;
        border-radius: 8px;
        background: #fff;
        overflow: hidden;
      }

      header,
      .toolbar,
      footer {
        display: flex;
        align-items: center;
        border-bottom: 1px solid #e3e7ed;
      }

      header {
        min-height: 56px;
        gap: 10px;
        padding: 0 20px;
        font-weight: 600;
      }

      .toolbar {
        gap: 10px;
        flex-wrap: wrap;
        padding: 10px 16px;
      }

      input,
      select {
        height: 38px;
        border: 1px solid #cfd7df;
        border-radius: 6px;
        background: #fff;
        color: #1d2329;
        font: inherit;
      }

      input {
        width: 320px;
        padding: 0 12px;
      }

      select {
        width: 220px;
        padding: 0 10px;
      }

      .direction {
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 19px;
        background: transparent;
        color: #26323d;
        font-size: 20px;
      }

      main {
        flex: 1;
        display: grid;
        grid-template-columns: repeat(3, minmax(240px, 1fr));
        gap: 12px;
        padding: 16px;
        overflow: auto;
      }

      .column {
        display: flex;
        flex-direction: column;
        min-height: 0;
        border: 1px solid #e1e6ec;
        border-radius: 8px;
        background: #fafbfc;
      }

      .column h2 {
        margin: 0;
        padding: 12px;
        border-bottom: 1px solid #e1e6ec;
        font-size: 14px;
      }

      .cards {
        display: grid;
        gap: 8px;
        padding: 10px;
      }

      .card {
        min-height: 78px;
        padding: 10px;
        border: 1px solid #dfe5eb;
        border-radius: 8px;
        background: #fff;
      }

      .meta {
        margin-top: 8px;
        color: #65717d;
        font-size: 13px;
      }

      footer {
        min-height: 52px;
        justify-content: space-between;
        padding: 0 16px;
        border-top: 1px solid #e3e7ed;
        border-bottom: 0;
      }

      .pager {
        color: #26323d;
        letter-spacing: 3px;
      }
    </style>
  </head>
  <body>
    <section class="surface" aria-label="Board project filter preview">
      <header>
        <span aria-hidden="true">kanban</span>
        <span>Board</span>
      </header>
      <div class="toolbar">
        <input aria-label="Search" placeholder="Search" value="Pagination Task">
        <select aria-label="Sort by">
          <option selected>Created</option>
          <option>Updated</option>
          <option>Title</option>
        </select>
        <button class="direction" title="Sort descending" aria-label="Sort descending">↓</button>
        <select aria-label="Project">
          <option>All projects</option>
          <option selected>Pagination Base Project</option>
          <option>Pagination Other Project</option>
        </select>
      </div>
      <main>
        <section class="column">
          <h2>Pending 18</h2>
          <div class="cards">
            <article class="card">
              <div>Pagination Task 20</div>
              <div class="meta">Pagination Base Project / CREATED</div>
            </article>
            <article class="card">
              <div>Pagination Task 19</div>
              <div class="meta">Pagination Base Project / CREATED</div>
            </article>
          </div>
        </section>
        <section class="column">
          <h2>Running 2</h2>
          <div class="cards">
            <article class="card">
              <div>Pagination Task 18</div>
              <div class="meta">Pagination Base Project / RUNNING</div>
            </article>
          </div>
        </section>
        <section class="column">
          <h2>Complete 0</h2>
          <div class="cards">
            <article class="card">
              <div>No matching completed tasks</div>
              <div class="meta">Other projects are filtered out</div>
            </article>
          </div>
        </section>
      </main>
      <footer>
        <span>Showing 1-20 of 21</span>
        <span class="pager" aria-hidden="true">|&lt; &lt; &gt; &gt;|</span>
      </footer>
    </section>
  </body>
</html>
