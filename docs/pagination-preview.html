<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pagination Preview</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f8fa;
        color: #1d2329;
      }

      body {
        margin: 0;
        padding: 32px;
      }

      .surface {
        max-width: 920px;
        min-height: 540px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        border: 1px solid #d9dee5;
        border-radius: 8px;
        background: #ffffff;
        overflow: hidden;
      }

      header,
      footer {
        min-height: 56px;
        display: flex;
        align-items: center;
        padding: 0 20px;
        border-bottom: 1px solid #e3e7ed;
      }

      header {
        gap: 10px;
        font-weight: 600;
      }

      main {
        flex: 1;
        padding: 16px;
        display: grid;
        gap: 8px;
        align-content: start;
      }

      .row {
        min-height: 64px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 14px;
        border: 1px solid #e1e6ec;
        border-radius: 8px;
      }

      .icon {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border-radius: 6px;
        background: #e9f2f2;
        color: #1f6666;
      }

      .meta {
        color: #65717d;
        font-size: 13px;
      }

      footer {
        justify-content: space-between;
        border-top: 1px solid #e3e7ed;
        border-bottom: 0;
      }

      .controls {
        display: flex;
        gap: 4px;
      }

      button {
        width: 36px;
        height: 36px;
        border: 0;
        border-radius: 18px;
        background: transparent;
        color: #26323d;
        font-size: 20px;
      }

      button:disabled {
        color: #a5adb7;
      }

      button:not(:disabled) {
        cursor: pointer;
      }

      button:not(:disabled):hover {
        background: #edf1f5;
      }
    </style>
  </head>
  <body>
    <section class="surface" aria-label="Projects page pagination preview">
      <header>
        <span aria-hidden="true">folder</span>
        <span>Projects</span>
      </header>
      <main>
        <div class="row">
          <div class="icon" aria-hidden="true">P</div>
          <div>
            <div>API Gateway</div>
            <div class="meta">git@example.com:gateway.git / main / gateway</div>
          </div>
        </div>
        <div class="row">
          <div class="icon" aria-hidden="true">P</div>
          <div>
            <div>Worker Runtime</div>
            <div class="meta">git@example.com:worker.git / main / worker</div>
          </div>
        </div>
        <div class="row">
          <div class="icon" aria-hidden="true">P</div>
          <div>
            <div>Manager UI</div>
            <div class="meta">git@example.com:manager.git / develop / manager</div>
          </div>
        </div>
      </main>
      <footer>
        <span>Showing 1-20 of 47</span>
        <div class="controls" aria-label="Pagination controls">
          <button disabled title="First page">|&lt;</button>
          <button disabled title="Previous page">&lt;</button>
          <button title="Next page">&gt;</button>
          <button title="Last page">&gt;|</button>
        </div>
      </footer>
    </section>
  </body>
</html>
