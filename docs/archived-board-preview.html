<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Archived Board Preview</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #f6f8fa;
        color: #1f2933;
      }

      body {
        margin: 0;
        padding: 32px;
      }

      .surface {
        max-width: 1120px;
        margin: 0 auto;
        background: #ffffff;
        border: 1px solid #d9e2ec;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 18px 20px;
        border-bottom: 1px solid #d9e2ec;
      }

      .title {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 20px;
        font-weight: 700;
      }

      .segments {
        display: inline-flex;
        border: 1px solid #9fb3c8;
        border-radius: 8px;
        overflow: hidden;
      }

      .segment {
        padding: 8px 14px;
        border-right: 1px solid #9fb3c8;
        font-size: 14px;
        background: #ffffff;
      }

      .segment:last-child {
        border-right: 0;
      }

      .segment.active {
        background: #2d6a6a;
        color: #ffffff;
        font-weight: 700;
      }

      .toolbar {
        display: flex;
        gap: 12px;
        padding: 14px 20px;
        border-bottom: 1px solid #d9e2ec;
      }

      .field {
        min-width: 220px;
        padding: 9px 12px;
        border: 1px solid #bcccdc;
        border-radius: 6px;
        color: #52606d;
      }

      .list {
        padding: 18px 20px 24px;
        display: grid;
        gap: 10px;
      }

      .row {
        display: grid;
        grid-template-columns: 32px 1fr auto auto;
        align-items: center;
        gap: 12px;
        padding: 12px;
        border: 1px solid #d9e2ec;
        border-radius: 8px;
        background: #ffffff;
      }

      .icon {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: #e0f2f1;
        color: #23605f;
      }

      .task-title {
        font-weight: 700;
      }

      .meta {
        margin-top: 3px;
        color: #627d98;
        font-size: 13px;
      }

      .pill {
        padding: 4px 8px;
        border: 1px solid #bcccdc;
        border-radius: 6px;
        color: #52606d;
        background: #f0f4f8;
        font-size: 12px;
        font-weight: 700;
      }

      .delete {
        width: 34px;
        height: 34px;
        border: 1px solid #f3c4c4;
        border-radius: 6px;
        color: #b42318;
        background: #fff5f5;
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <main class="surface">
      <section class="header">
        <div class="title">Board</div>
        <nav class="segments" aria-label="Board views">
          <div class="segment">Kanban</div>
          <div class="segment">List</div>
          <div class="segment">Calendar</div>
          <div class="segment active">Archived</div>
        </nav>
      </section>
      <section class="toolbar">
        <div class="field">Search archived tasks</div>
        <div class="field">Project: All projects</div>
        <div class="field">Sort: Updated</div>
      </section>
      <section class="list">
        <article class="row">
          <div class="icon">A</div>
          <div>
            <div class="task-title">Archived cleanup task</div>
            <div class="meta">Block Play Table - Unassigned - 2026-04-25</div>
          </div>
          <div class="pill">ARCHIVED</div>
          <button class="delete" aria-label="Delete task">x</button>
        </article>
        <article class="row">
          <div class="icon">A</div>
          <div>
            <div class="task-title">Deprecated worker migration</div>
            <div class="meta">Manager - local-worker - 2026-04-26</div>
          </div>
          <div class="pill">ARCHIVED</div>
          <button class="delete" aria-label="Delete task">x</button>
        </article>
      </section>
    </main>
  </body>
</html>
